name: Windows app and tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Test with isolated fixture profiles
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python main.py --smoke-test
      - name: Build portable Windows app
        run: python packaging/build.py
      - name: Smoke test packaged executable
        run: |
          $process = Start-Process -FilePath dist\MoodPet\MoodPet.exe -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Packaged smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw "Packaged smoke test failed: $($process.ExitCode)" }
      - name: Build per-user installer
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler missing' }
          & $compiler.FullName packaging\MoodPet.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and checksum
        run: |
          Compress-Archive -Path dist\MoodPet -DestinationPath dist\MoodPet-Windows.zip
          Get-FileHash dist\MoodPet-Windows.zip, dist\MoodPet-Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Set-Content dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MoodPet-Windows
          path: |
            dist/MoodPet-Windows.zip
            dist/MoodPet-Setup.exe
            dist/SHA256SUMS.txt
